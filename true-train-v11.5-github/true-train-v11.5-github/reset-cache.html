<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>TRUE TRAIN — Reset Cache</title>
  <style>
    body{margin:0;background:#0b1020;color:#eef7ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;min-height:100vh;place-items:center;padding:24px}
    main{width:min(520px,100%);background:#0e192b;border:1px solid #22344f;border-radius:18px;padding:22px;box-sizing:border-box}
    h1{font-size:22px;margin:0 0 10px}p{color:#9bb0c5;line-height:1.55}.ok{color:#79e6ad}.bad{color:#ff9bad}button,a{display:inline-flex;min-height:44px;align-items:center;justify-content:center;border-radius:12px;padding:0 14px;font-weight:800;text-decoration:none}button{border:0;background:#55dfff;color:#07121d;cursor:pointer}a{margin-left:8px;border:1px solid #2d4767;color:#eef7ff}
  </style>
</head>
<body>
<main>
  <h1>TRUE TRAIN — Cache Reset</h1>
  <p>Dùng trang này chỉ khi GitHub Pages vẫn hiện bản cũ hoặc màn hình trắng sau khi deploy.</p>
  <button id="reset">RESET TRUE TRAIN CACHE</button><a href="./">BACK TO APP</a>
  <p id="status"></p>
</main>
<script>
const status=document.getElementById('status');
document.getElementById('reset').onclick=async()=>{
  try{
    const basePath=new URL('./',location.href).pathname;
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>new URL(r.scope).pathname.startsWith(basePath)).map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('true-train-')).map(k=>caches.delete(k)));
    }
    status.className='ok';status.textContent='Đã xóa cache TRUE TRAIN. Đang mở lại app...';
    setTimeout(()=>location.replace('./?cache-reset='+Date.now()),700);
  }catch(e){status.className='bad';status.textContent='Reset thất bại: '+(e?.message||e);}
};
</script>
</body>
</html>
