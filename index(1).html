<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TRUE TRAIN" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./true-train-logo.png" />
  <link rel="icon" type="image/png" href="./true-train-logo.png" />
  <title>TRUE TRAIN • MASTER TRAINING TRACKER</title>
  <style>
    :root{
      --bg:#0b1020;
      --panel:#121a2e;
      --panel2:#18233d;
      --line:#2b3a5f;
      --text:#f4f7fb;
      --muted:#9fafc6;
      --accent:#5ad1ff;
      --accent2:#7c5cff;
      --good:#44d483;
      --warn:#ffbf4b;
      --danger:#ff667a;
      --white:#ffffff;
      --shadow:0 14px 40px rgba(0,0,0,.28);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:linear-gradient(180deg,#090d18 0%,#0d1426 100%);
      color:var(--text);
      min-height:100vh;
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{max-width:1420px;margin:0 auto;padding:24px}
    .topbar{
      position:sticky;top:0;z-index:20;
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      margin:-24px -24px 24px;padding:18px 24px;
      background:rgba(9,13,24,.88);backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(255,255,255,.06)
    }
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:var(--shadow)}
    .brand h1{font-size:18px;margin:0}.brand small{display:block;color:var(--muted);margin-top:2px}
    .nav{display:flex;gap:8px;flex-wrap:wrap}
    .nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 14px;border-radius:12px}
    .nav button.active{background:var(--panel2);color:var(--white);border-color:var(--line)}
    .top-actions{display:flex;gap:8px}
    .btn{border:none;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--panel2);color:var(--text);border:1px solid var(--line)}
    .btn:hover{filter:brightness(1.08)}
    .btn.primary{background:linear-gradient(135deg,var(--accent),#52a9ff);color:#07101c;border:none}
    .btn.good{background:var(--good);color:#07120c;border:none}
    .btn.danger{background:rgba(255,102,122,.12);color:#ff8a9b;border-color:rgba(255,102,122,.35)}
    .btn.ghost{background:transparent}
    .page{display:none}.page.active{display:block}
    .hero{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;margin-bottom:18px}
    .card{background:linear-gradient(180deg,rgba(24,35,61,.92),rgba(18,26,46,.96));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .card.pad{padding:20px}
    .hero-main{padding:24px;position:relative;overflow:hidden}
    .hero-main:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-100px;background:radial-gradient(circle,rgba(90,209,255,.23),transparent 68%)}
    .eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);font-weight:800}
    h2{margin:7px 0 6px;font-size:30px}.subtitle{color:var(--muted);margin:0}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
    .stat{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:14px}
    .stat b{font-size:24px;display:block}.stat span{color:var(--muted);font-size:12px}
    .quick{padding:20px;display:flex;flex-direction:column;gap:13px}
    .quick-title{font-weight:800;font-size:16px}
    .field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;color:var(--muted);font-weight:700}
    input,select,textarea{width:100%;background:#0d1426;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px 11px;outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(90,209,255,.10)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .section-head h3{margin:0;font-size:18px}.section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}
    .exercise-list{display:flex;flex-direction:column;gap:14px}
    .exercise-card{border:1px solid var(--line);border-radius:16px;background:#0f172b;padding:16px}
    .exercise-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .exercise-name{font-size:16px;font-weight:850}.exercise-meta{color:var(--muted);font-size:12px;margin-top:4px}
    .badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:rgba(90,209,255,.10);color:var(--accent);border:1px solid rgba(90,209,255,.2)}
    .set-table{width:100%;border-collapse:separate;border-spacing:0 8px;margin-top:12px}.set-table th{color:var(--muted);font-size:11px;text-align:left;padding:0 6px}.set-table td{padding:0 6px}.set-table input{padding:9px 10px}
    .set-index{width:46px;text-align:center;font-weight:800;color:var(--muted)}
    .set-done{width:72px;text-align:center}.set-done input{width:18px;height:18px;accent-color:var(--good)}
    .progressbar{height:8px;background:#0b1120;border:1px solid rgba(255,255,255,.05);border-radius:999px;overflow:hidden;margin-top:11px}.progressbar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good));width:0%}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
    .toolbar .field{min-width:170px}.toolbar .field.grow{flex:1}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
    table.data{width:100%;border-collapse:collapse;min-width:900px;background:#0f172b}
    table.data th,table.data td{padding:11px 10px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:middle}
    table.data th{position:sticky;top:0;background:#141f37;color:var(--muted);text-align:left;font-size:12px;z-index:1}
    table.data tr:last-child td{border-bottom:none} table.data td input, table.data td select{min-width:90px;padding:8px 9px}
    .row-actions{display:flex;gap:6px}.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#10182b;color:var(--text)}

    /* Lịch tập: ưu tiên không gian cho tên bài; Sets/Reps/RIR gọn hơn */
    table.schedule-table{min-width:1180px;table-layout:fixed}
    table.schedule-table th:nth-child(1),table.schedule-table td:nth-child(1){width:44px;text-align:center}
    table.schedule-table th:nth-child(2),table.schedule-table td:nth-child(2){width:330px}
    table.schedule-table th:nth-child(3),table.schedule-table td:nth-child(3){width:165px}
    table.schedule-table th:nth-child(4),table.schedule-table td:nth-child(4){width:150px}
    table.schedule-table th:nth-child(5),table.schedule-table td:nth-child(5){width:190px}
    table.schedule-table th:nth-child(6),table.schedule-table td:nth-child(6){width:66px;text-align:center}
    table.schedule-table th:nth-child(7),table.schedule-table td:nth-child(7){width:82px;text-align:center}
    table.schedule-table th:nth-child(8),table.schedule-table td:nth-child(8){width:66px;text-align:center}
    table.schedule-table th:nth-child(9),table.schedule-table td:nth-child(9){width:118px}
    table.schedule-table td input{width:100%;min-width:0}
    table.schedule-table td:nth-child(6) input,
    table.schedule-table td:nth-child(7) input,
    table.schedule-table td:nth-child(8) input{min-width:0;padding:8px 5px;text-align:center}
    .vol-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.vol-card{padding:16px}.vol-card .name{font-weight:800}.vol-numbers{display:flex;gap:18px;margin-top:9px}.vol-numbers b{font-size:22px}.vol-numbers span{display:block;color:var(--muted);font-size:11px}.bar{height:10px;border-radius:999px;background:#0b1120;margin-top:13px;overflow:hidden;border:1px solid rgba(255,255,255,.05)}.bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:0%}
    .history-card{padding:16px;margin-bottom:12px}.history-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.history-title{font-weight:850}.history-sub{color:var(--muted);font-size:12px;margin-top:3px}.history-actions{display:flex;gap:7px}.history-details{display:none;margin-top:14px}.history-details.open{display:block}
    .mini-table{width:100%;border-collapse:collapse}.mini-table th,.mini-table td{padding:8px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left;font-size:12px}.mini-table th{color:var(--muted)}
    .empty{text-align:center;color:var(--muted);padding:34px 14px;border:1px dashed var(--line);border-radius:14px}
    .note{padding:12px 14px;border-radius:12px;background:rgba(255,191,75,.08);border:1px solid rgba(255,191,75,.2);color:#ffd785;font-size:12px}
    .data-actions{display:flex;gap:10px;flex-wrap:wrap}.small{font-size:12px;color:var(--muted)}
    .toast{position:fixed;right:24px;bottom:24px;z-index:99;background:#15213a;border:1px solid var(--line);color:var(--text);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);transform:translateY(30px);opacity:0;pointer-events:none;transition:.22s}.toast.show{transform:translateY(0);opacity:1}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modal.open{display:flex}.modal-box{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.modal-box h3{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

    /* Dashboard + KHANHDUY branding */
    .brand h1{letter-spacing:.055em;font-weight:900}
    .brand small{letter-spacing:.035em}
    .logo{font-size:14px;letter-spacing:.04em}
    .dashboard-hero{display:grid;grid-template-columns:1.45fr .75fr;gap:18px;margin-bottom:18px}
    .dashboard-welcome{padding:28px;position:relative;overflow:hidden;min-height:230px;display:flex;flex-direction:column;justify-content:center}
    .dashboard-welcome:before{content:"KD";position:absolute;right:24px;bottom:-42px;font-size:170px;font-weight:1000;line-height:1;color:rgba(255,255,255,.025);letter-spacing:-.08em;pointer-events:none}
    .dashboard-welcome:after{content:"";position:absolute;right:-70px;top:-100px;width:330px;height:330px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.20),rgba(90,209,255,.08) 45%,transparent 70%);pointer-events:none}
    .dashboard-title{font-size:clamp(30px,4vw,48px);line-height:1.03;margin:10px 0 9px;letter-spacing:-.035em;position:relative;z-index:1}
    .dashboard-title span{background:linear-gradient(135deg,#fff 20%,var(--accent) 72%);-webkit-background-clip:text;background-clip:text;color:transparent}
    .dashboard-tagline{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;position:relative;z-index:1}
    .dashboard-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;position:relative;z-index:1}
    .today-card{padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
    .today-day{color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    .today-session{font-size:27px;font-weight:900;margin-top:5px}
    .today-focus{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.55}
    .today-meta{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .today-meta div{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px}
    .today-meta b{font-size:20px;display:block}.today-meta span{font-size:11px;color:var(--muted)}
    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
    .kpi-card{padding:18px;position:relative;overflow:hidden}
    .kpi-card .kpi-label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.07em}
    .kpi-card .kpi-value{font-size:30px;font-weight:950;margin-top:7px;letter-spacing:-.025em}
    .kpi-card .kpi-sub{font-size:11px;color:var(--muted);margin-top:4px}
    .kpi-card .kpi-accent{position:absolute;right:-18px;bottom:-24px;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,rgba(90,209,255,.12),transparent 70%)}
    .dashboard-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
    .muscle-progress-list{display:flex;flex-direction:column;gap:13px}
    .muscle-progress-row{display:grid;grid-template-columns:125px 1fr 78px;gap:12px;align-items:center}
    .muscle-progress-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .muscle-progress-track{height:9px;background:#0a1020;border:1px solid rgba(255,255,255,.05);border-radius:999px;overflow:hidden}
    .muscle-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent),var(--good));border-radius:999px}
    .muscle-progress-value{text-align:right;font-size:11px;color:var(--muted)}
    .recent-list{display:flex;flex-direction:column;gap:10px}
    .recent-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
    .recent-item:last-child{border-bottom:none}
    .recent-main{min-width:0}.recent-title{font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.recent-sub{font-size:11px;color:var(--muted);margin-top:3px}
    .recent-pct{font-weight:900;font-size:13px;white-space:nowrap}
    .dashboard-link{border:none;background:none;color:var(--accent);font-weight:800;padding:0}
    @media(max-width:1000px){.hero,.grid2,.dashboard-hero,.dashboard-grid{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(2,1fr)}.vol-grid{grid-template-columns:repeat(2,1fr)}.topbar{align-items:flex-start;flex-direction:column}.nav{width:100%;overflow:auto;flex-wrap:nowrap;padding-bottom:2px}.top-actions{position:absolute;right:24px;top:18px}}
    @media(max-width:680px){.app{padding:14px}.topbar{margin:-14px -14px 16px;padding:14px}.top-actions{right:14px;top:14px}.top-actions .btn span{display:none}.hero-main,.dashboard-welcome{padding:18px}.dashboard-welcome{min-height:210px}.dashboard-title{font-size:34px}.kpi-grid{grid-template-columns:1fr 1fr}.muscle-progress-row{grid-template-columns:92px 1fr 66px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.vol-grid{grid-template-columns:1fr}.set-table th:nth-child(4),.set-table td:nth-child(4){display:none}.btn{padding:9px 11px}.hide-mobile{display:none}}


    /* V4: Mobile-first web app / PWA */
    .bottom-nav{display:none}
    .pwa-install{display:none}
    .top-icon-btn{width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:18px}
    .mobile-only{display:none}
    .desktop-only{display:block}
    @media(max-width:760px){
      body{padding-bottom:calc(76px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
      .app{padding:12px 12px 22px}
      .topbar{
        position:sticky;top:0;margin:-12px -12px 14px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
        flex-direction:row;align-items:center;gap:10px;background:rgba(9,13,24,.94)
      }
      .brand{min-width:0;gap:9px}.logo{width:38px;height:38px;border-radius:12px;flex:0 0 auto}
      .brand h1{font-size:15px}.brand small{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
      .nav{display:none!important}
      .top-actions{position:static;margin-left:auto;display:flex;gap:6px}
      .top-actions .btn{display:none}
      .top-actions .top-icon-btn{display:grid}
      .mobile-only{display:block}.desktop-only{display:none}

      .bottom-nav{
        display:grid;grid-template-columns:repeat(5,1fr);position:fixed;z-index:60;left:0;right:0;bottom:0;
        padding:7px 8px calc(7px + env(safe-area-inset-bottom));
        background:rgba(9,13,24,.96);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.08)
      }
      .bottom-nav button{border:0;background:transparent;color:var(--muted);padding:5px 3px 3px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
      .bottom-nav button .bn-icon{font-size:19px;line-height:1}.bottom-nav button .bn-label{font-size:9px;font-weight:800;white-space:nowrap}
      .bottom-nav button.active{color:var(--accent);background:rgba(90,209,255,.08)}

      .dashboard-hero,.dashboard-grid,.hero,.grid2{grid-template-columns:1fr;gap:12px}
      .dashboard-welcome{padding:19px;min-height:190px}.dashboard-welcome:before{font-size:120px;right:8px}
      .dashboard-title{font-size:31px}.dashboard-tagline{font-size:11px}.dashboard-actions{margin-top:16px}
      .dashboard-actions .btn{width:100%}
      .today-card{padding:17px}.today-session{font-size:23px}
      .kpi-grid{grid-template-columns:1fr 1fr;gap:10px}.kpi-card{padding:14px}.kpi-card .kpi-value{font-size:25px}
      .card.pad{padding:14px}.hero-main{padding:17px}.quick{padding:15px}
      h2{font-size:25px}.section-head{align-items:flex-start}.section-head h3{font-size:17px}
      .stats{gap:8px}.stat{padding:11px}.stat b{font-size:21px}
      .toolbar{display:grid;grid-template-columns:1fr;gap:10px}.toolbar .field{min-width:0}.toolbar .field.grow{width:100%}
      .toolbar > .btn{width:100%}

      /* Lịch tập: biến từng row thành card để không phải kéo ngang */
      .table-wrap.mobile-cards{overflow:visible;border:0;background:transparent}
      table.schedule-table{min-width:0!important;width:100%;display:block;background:transparent}
      table.schedule-table thead{display:none}
      table.schedule-table tbody{display:flex;flex-direction:column;gap:12px}
      table.schedule-table tr{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:13px;background:#0f172b;border:1px solid var(--line);border-radius:15px}
      table.schedule-table td{display:block;width:auto!important;padding:0!important;border:0!important;text-align:left!important;min-width:0}
      table.schedule-table td::before{content:attr(data-label);display:block;font-size:10px;color:var(--muted);font-weight:800;margin:0 0 4px;letter-spacing:.03em;text-transform:uppercase}
      table.schedule-table td:nth-child(1){grid-column:1/-1;font-weight:900;color:var(--accent)}
      table.schedule-table td:nth-child(2),table.schedule-table td:nth-child(3),table.schedule-table td:nth-child(4),table.schedule-table td:nth-child(5),table.schedule-table td:nth-child(9){grid-column:1/-1}
      table.schedule-table td:nth-child(6),table.schedule-table td:nth-child(7),table.schedule-table td:nth-child(8){grid-column:auto}
      table.schedule-table td input{min-height:42px;font-size:16px}
      table.schedule-table .row-actions{justify-content:flex-end}
      table.schedule-table .icon-btn{width:42px;height:42px}

      /* Workout inputs optimized for thumbs */
      .exercise-card{padding:13px}.exercise-top{gap:8px}.exercise-name{font-size:15px}.exercise-meta{line-height:1.55}
      .set-table{border-spacing:0 7px;table-layout:fixed}
      .set-table th{font-size:9px;padding:0 3px;text-align:center}.set-table td{padding:0 3px}
      .set-table th:nth-child(1),.set-table td:nth-child(1){width:34px}
      .set-table th:nth-child(5),.set-table td:nth-child(5){width:42px}
      .set-table input[type=number]{padding:10px 4px;text-align:center;font-size:16px;min-width:0}
      .set-table th:nth-child(4),.set-table td:nth-child(4){display:table-cell!important}
      .set-done input{width:24px;height:24px}
      .badge{max-width:95px;text-align:center;justify-content:center}

      .vol-grid{grid-template-columns:1fr}.muscle-progress-row{grid-template-columns:86px 1fr 62px;gap:8px}
      .history-head{align-items:flex-start;flex-direction:column}.history-actions{width:100%}.history-actions .btn{flex:1}
      .history-details{overflow-x:auto}.mini-table{min-width:560px}
      .toast{left:12px;right:12px;bottom:calc(82px + env(safe-area-inset-bottom));text-align:center}
      .modal{padding:12px}.modal-box{padding:16px}
      input,select,textarea{font-size:16px;min-height:44px}
      .btn{min-height:42px}
      .pwa-install.show{display:inline-flex}
    }

    /* V5 Cloud Sync */
    .cloud-status-btn{gap:7px}
    .cloud-status-btn.syncing{border-color:#38bdf8;color:#7dd3fc}
    .cloud-status-btn.synced{border-color:#34d399;color:#6ee7b7}
    .cloud-status-btn.warn{border-color:#f59e0b;color:#fbbf24}

body.auth-locked{
  padding-bottom:0!important;
  overflow:hidden;
}

  display:none!important;
}

}

.auth-login-btn{

    function defaultIndirectFor(ex={}){
      const name=String(ex.name||'').toLowerCase();
      const group=String(ex.group||'').trim();
      if(group==='Ngực'){
        if(name.includes('fly') || name.includes('pec deck')) return 'Vai trước';
        return 'Tay sau, Vai trước';
      }
      if(group==='Xô/Lưng'){
        if(name.includes('straight-arm') || name.includes('pullover')) return 'Vai sau';
        if(name.includes('row')) return 'Tay trước, Vai sau';
        return 'Tay trước';
      }
      if(group==='Trap'){
        if(name.includes('kelso') || name.includes('face pull') || name.includes('row')) return 'Vai sau, Tay trước';
        return '';
      }
      if(group==='Đùi trước') return 'Mông';
      if(group==='Đùi sau') return 'Mông';
      if(group==='Đùi sau/Mông') return 'Mông';
      return '';
    }

    function splitIndirectGroups(text=''){

      return {name,detail:lib?.region||lib?.group||'',group:lib?.group||'Khác',indirect:lib?.secondary||'',sets:Number(sets)||3,reps:reps||lib?.reps||'8–12',rir:rir||'2'};

    function workoutTemplateSchedule(key){
      const tpl=WORKOUT_TEMPLATES[String(key)]; if(!tpl)return null;

    }

    /* ===== COACH TOOLS ===== */
    function normalizeSearch(v=''){return String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().trim();}
    function normalizeVietnamese(v=''){return String(v).normalize('NFC').toLowerCase().trim().replace(/\s+/g,' ');}
    function queryHasVietnameseMarks(v=''){return /[àáạảãăằắặẳẵâầấậẩẫèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(String(v));}
    function foodSearchScore(food,query=''){
      const q=normalizeVietnamese(query); if(!q)return 0;
      const name=normalizeVietnamese(food.name||''), cat=normalizeVietnamese(food.category||''), aliases=normalizeVietnamese(food.aliases||'');
      const words=name.split(/\s+/).filter(Boolean), aliasWords=aliases.split(/\s+/).filter(Boolean);
      if(name===q)return 0;
      if(name.startsWith(q))return 10;
      if(words.includes(q))return 15;
      if(words.some(w=>w.startsWith(q)))return 20;
      if(name.includes(q))return 30;
      if(aliasWords.includes(q))return 35;
      if(aliases.includes(q))return 40;
      if(cat===q||cat.startsWith(q))return 45;
      if(queryHasVietnameseMarks(q))return Infinity;
      const nq=normalizeSearch(q), nn=normalizeSearch(name), na=normalizeSearch(aliases), nc=normalizeSearch(cat);
      if(nn===nq)return 60;
      if(nn.startsWith(nq))return 65;
      if(nn.split(/\s+/).some(w=>w.startsWith(nq)))return 70;
      if(nn.includes(nq))return 75;
      if(na.includes(nq))return 80;
      if(nc.includes(nq))return 90;
      return Infinity;
    }
    function rankedFoodSearch(foods,query='',limit=10){
      const q=String(query||'').trim();if(!q)return foods.slice(0,limit);
      return foods.map((food,index)=>({food,index,score:foodSearchScore(food,q)})).filter(x=>Number.isFinite(x.score)).sort((a,b)=>a.score-b.score||a.index-b.index).slice(0,limit).map(x=>x.food);
    }
    function fmtKcal(n){ return Math.round(Number(n)||0).toLocaleString('vi-VN'); }
    function clampNum(v,min,max){ const n=Number(v); return Math.min(max,Math.max(min,Number.isFinite(n)?n:min)); }
    function calcTDEEValues(t=state.coach.tdee){
      const weight=Math.max(1,Number(t.weight)||0), activity=Number(t.activity)||1.2;
      const height=Math.max(1,Number(t.height)||0), age=Math.max(1,Number(t.age)||0);
      let bmr=0;
      if(t.mode==='bodyfat'){
        const bf=clampNum(t.bodyFat,2,70);
        const lbm=weight*(1-bf/100);
        bmr=370+21.6*lbm;
      }else{
        bmr=10*weight+6.25*height-5*age+(t.sex==='female'?-161:5);
      }
      const tdee=bmr*activity;
      const cutAdjust=clampNum(t.cutAdjust??-15,-40,-1);
      const gainAdjust=clampNum(t.gainAdjust??8,1,30);
      const adjust=clampNum(t.goalAdjust,-50,50);
      return {bmr,tdee,maintain:tdee,cut:tdee*(1+cutAdjust/100),gain:tdee*(1+gainAdjust/100),goal:tdee*(1+adjust/100),adjust,cutAdjust,gainAdjust};
    }

    }

    function useTdeeForMacro(calories,weight,plan='goal'){
      state.coach.macro.calories=Math.round(calories);
      state.coach.macro.weight=Number(weight)||state.coach.macro.weight;
      state.coach.macro.plan=plan;
      state.coach.activeTab='macro';
      saveState(); renderCoach(); toast('Đã chuyển calories sang Macro');
    }

    function macroFactor(key){ return key==='fat'?9:4; }
    function computeMacros(m=state.coach.macro){
      const kcal=Math.max(1,Number(m.calories)||0), weight=Math.max(1,Number(m.weight)||0);
      const keys=['protein','carb','fat'];
      let auto=keys.find(k=>m[k]?.mode==='auto')||m.auto||'fat';
      if(!keys.includes(auto)) auto='fat';
      const out={}, fixedKcal=keys.filter(k=>k!==auto).reduce((sum,k)=>{
        const x=m[k]||{}, factor=macroFactor(k), value=Math.max(0,Number(x.value)||0);
        let grams=0, mkcal=0;
        if(x.mode==='gkg'){grams=value*weight;mkcal=grams*factor;}
        else {mkcal=kcal*value/100;grams=mkcal/factor;}
        out[k]={grams,kcal:mkcal,percent:mkcal/kcal*100,mode:x.mode};
        return sum+mkcal;
      },0);
      const remain=kcal-fixedKcal;
      out[auto]={grams:Math.max(0,remain)/macroFactor(auto),kcal:Math.max(0,remain),percent:Math.max(0,remain)/kcal*100,mode:'auto'};
      return {kcal,weight,auto,out,error:remain<0?`Hai macro cố định đã vượt mục tiêu ${fmtKcal(kcal)} kcal (${fmtKcal(fixedKcal)} kcal).`:''};
    }

    function coachFoodLibrary(){
      return [...FOOD_LIBRARY,...(state.coach.nutrition.customFoods||[])];
    }
    function coachFoodById(id){ return coachFoodLibrary().find(x=>x.id===id); }
    function foodMacros(food,grams){
      const f=food||{kcal:0,protein:0,carb:0,fat:0},g=Math.max(0,Number(grams)||0)/100;
      return {kcal:f.kcal*g,protein:f.protein*g,carb:f.carb*g,fat:f.fat*g};
    }
    function addMacroObj(a,b){return {kcal:a.kcal+b.kcal,protein:a.protein+b.protein,carb:a.carb+b.carb,fat:a.fat+b.fat};}
    function buildMealFromTarget(target,template){
      const foods=[];let total={kcal:0,protein:0,carb:0,fat:0};
      const add=(id,grams)=>{const food=coachFoodById(id);if(!food||grams<=0)return;grams=Math.round(Math.min(600,Math.max(0,grams)));const m=foodMacros(food,grams);foods.push({food,grams});total=addMacroObj(total,m);};
      const pFood=coachFoodById(template[0]), cFood=coachFoodById(template[1]), fFood=coachFoodById(template[2]);
      const pNeed=Math.max(0,target.protein-total.protein);add(template[0],pFood?.protein?pNeed/(pFood.protein/100):0);
      const cNeed=Math.max(0,target.carb-total.carb);add(template[1],cFood?.carb?cNeed/(cFood.carb/100):0);
      const fNeed=Math.max(0,target.fat-total.fat);add(template[2],fFood?.fat?fNeed/(fFood.fat/100):0);
      return {foods,total,target};
    }
    function buildThreeMealSuggestions(res){
      const fractions=[.30,.35,.35],names=['Meal 1','Meal 2','Meal 3'],templates=[['whey_generic','oats_dry','peanut_butter'],['chicken_breast_cooked','white_rice_cooked','olive_oil'],['lean_beef_95','potato_boiled','olive_oil']];
      return fractions.map((f,i)=>buildMealFromTarget({protein:res.out.protein.grams*f,carb:res.out.carb.grams*f,fat:res.out.fat.grams*f,kcal:res.kcal*f},templates[i])).map((x,i)=>Object.assign(x,{name:names[i]}));
    }

      c.querySelectorAll('[data-macro-plan]').forEach(b=>b.onclick=()=>{const key=b.dataset.macroPlan;m.plan=key;m.calories=Math.round(plans[key]);m.weight=Number(state.coach.tdee.weight)||m.weight;saveState();renderCoachMacro();});
      c.querySelectorAll('[data-macro-mode]').forEach(sel=>sel.onchange=()=>{

      if(/trapezius/.test(n))return 'Trap';

      if(/triceps brachii/.test(n))return 'Tay sau';
      if(/brachioradialis|flexor carpi|extensor carpi|palmaris|pronator|supinator/.test(n))return 'Cẳng tay';
      if(/rectus femoris|vastus lateralis|vastus medialis|vastus intermedius|sartorius/.test(n))return 'Đùi trước';
      if(/biceps femoris|semitendinosus|semimembranosus/.test(n))return 'Đùi sau';
      if(/gluteus/.test(n))return 'Mông';

      if(/gastrocnemius|soleus|tibialis anterior|fibularis|peroneus/.test(n))return 'Bắp chân';
      if(/rectus abdominis|oblique|transversus abdominis/.test(n))return 'Core';
      return '';
    }

    function isWorkoutSetComplete(set={}){

    function syncWorkoutCompletion(w){
      if(!w?.exercises)return {done:0,total:0,pct:0,complete:false};
      let done=0,total=0;
      w.exercises.forEach(ex=>(ex.sets||[]).forEach(set=>{if(set.note==null)set.note='';set.done=isWorkoutSetComplete(set);total++;if(set.done)done++;}));
      return {done,total,pct:total?Math.round(done/total*100):0,complete:total>0&&done===total};
    }

      if(doneEl)doneEl.textContent=`${st.done}/${st.total}`;if(pctEl)pctEl.textContent=`${st.pct}%`;if(bar)bar.style.width=`${st.pct}%`;

    function ensureCurrentWorkout(){
      const day = state.currentDay;
      const sched = state.schedule[day];
      if(!state.currentWorkout || state.currentWorkout.day!==day){
        state.currentWorkout = {
          id:uid(), date:isoDate(), day,
          title:sched.name, focus:sched.focus,
          exercises:sched.exercises.map(ex=>({
            name:ex.name, detail:ex.detail, group:ex.group, indirect:ex.indirect||'', targetReps:ex.reps, targetRir:ex.rir,
            sets:Array.from({length:Number(ex.sets)||0},(_,i)=>({index:i+1,weight:'',reps:'',rir:'',note:'',done:false}))
          }))
        };
        saveState();
      }
      return state.currentWorkout;
    }

    function renderWorkout(){
      const page=document.getElementById('page-workout');
      const w=ensureCurrentWorkout(),st=syncWorkoutCompletion(w),days=Object.keys(state.schedule);
      if(isMobileUI()){
        const firstIncomplete=w.exercises.findIndex(ex=>ex.sets.some(s=>!isWorkoutSetComplete(s)));
        if(mobileWorkoutOpen<0 || mobileWorkoutOpen>=w.exercises.length) mobileWorkoutOpen=firstIncomplete>=0?firstIncomplete:0;
        page.innerHTML=`
          <div class="mobile-workout-sticky">
            <div class="mobile-workout-sticky-top"><div><small>${escapeHtml(w.day)}</small><b>${escapeHtml(w.title)}</b></div><strong id="workoutDoneSets">${st.done}/${st.total}</strong></div>
            <div class="progressbar mobile-workout-progress"><span id="workoutProgress" style="width:${st.pct}%"></span></div>
            <div class="mobile-workout-sticky-foot"><span id="workoutPct">${st.pct}%</span><span id="workoutStatus" class="${st.complete?'done':''}">${st.complete?'Hoàn thành':'Đang tập'}</span></div>
          </div>
          <div class="card mobile-workout-controls">
            <div class="mobile-control-field"><label>Buổi</label><select id="workoutDay">${days.map(d=>`<option ${d===state.currentDay?'selected':''}>${d}</option>`).join('')}</select></div>
            <div class="mobile-control-field"><label>Ngày</label><input id="workoutDate" type="date" value="${w.date}"></div>
          </div>
          <div id="exerciseList" class="exercise-list mobile-exercise-list"></div>
          <div class="mobile-workout-actions">
            <button class="btn primary" id="saveWorkout">${st.complete?'✓ LƯU BUỔI HOÀN THÀNH':`LƯU TIẾN ĐỘ • ${st.done}/${st.total} SET`}</button>
            <button class="btn" id="resetWorkout">↻ Reset buổi tập</button>
          </div>`;
      }else{
        page.innerHTML=`
          <div class="hero">
            <div class="card hero-main">
              <div class="eyebrow">Buổi tập đang chọn</div>
              <h2>${escapeHtml(w.day)} • ${escapeHtml(w.title)}</h2>
              <p class="subtitle">${escapeHtml(w.focus)}</p>
              <div class="stats">
                <div class="stat"><b>${w.exercises.length}</b><span>Bài tập</span></div>
                <div class="stat"><b id="workoutDoneSets">${st.done}/${st.total}</b><span>Sets hoàn thành</span></div>
                <div class="stat"><b id="workoutPct">${st.pct}%</b><span>Tiến độ</span></div>
              </div>
              <div class="progressbar"><span id="workoutProgress" style="width:${st.pct}%"></span></div>
              <div id="workoutStatus" class="workout-status ${st.complete?'done':''}">${st.complete?'✓ Buổi tập đã hoàn thành':'Tự hoàn thành khi đủ Tạ • Rep • RIR'}</div>
            </div>
            <div class="card quick">
              <div class="quick-title">Chọn ngày / buổi tập</div>
              <div class="field"><label>Ngày trong tuần</label><select id="workoutDay">${days.map(d=>`<option ${d===state.currentDay?'selected':''}>${d}</option>`).join('')}</select></div>
              <div class="field"><label>Ngày tập</label><input id="workoutDate" type="date" value="${w.date}"></div>
              <button class="btn primary" id="saveWorkout">${st.complete?'✓ Lưu buổi đã hoàn thành vào nhật ký':`Lưu tiến độ vào nhật ký • ${st.done}/${st.total} set`}</button>
              <button class="btn" id="resetWorkout">↻ Reset dữ liệu buổi hiện tại</button>
            </div>
          </div>
          <div class="card pad">
            <div class="section-head"><div><h3>Nhập kết quả từng set</h3><p>Không cần tick. Set tự hoàn thành khi nhập đủ <b>Tạ + Rep + RIR</b>. Note là tùy chọn.</p></div></div>
            <div id="exerciseList" class="exercise-list"></div>
          </div>`;
      }
      document.getElementById('workoutDay').onchange=e=>{state.currentDay=e.target.value;state.currentWorkout=null;mobileWorkoutOpen=0;saveState();renderWorkout();};
      document.getElementById('workoutDate').onchange=e=>{w.date=e.target.value;saveState();};
      document.getElementById('saveWorkout').onclick=saveWorkoutToHistory;
      document.getElementById('resetWorkout').onclick=()=>confirmBox('Reset buổi tập','Xóa toàn bộ tạ/reps/RIR/note đã nhập ở buổi hiện tại?',()=>{state.currentWorkout=null;mobileWorkoutOpen=0;saveState();renderWorkout();toast('Đã reset buổi tập');});

    function bindWorkoutInputs(root){
      root.querySelectorAll('input[data-e][data-s][data-k]').forEach(inp=>{
        const handler=()=>{const e=+inp.dataset.e,si=+inp.dataset.s,k=inp.dataset.k,set=state.currentWorkout.exercises[e].sets[si];set[k]=inp.value;set.done=isWorkoutSetComplete(set);saveState();updateWorkoutCompletionUI(state.currentWorkout);};
        inp.addEventListener('input',handler);inp.addEventListener('change',handler);
      });
    }

    function renderExerciseCards(w){
      const el=document.getElementById('exerciseList');
      if(!w.exercises.length){el.innerHTML='<div class="empty">Ngày nghỉ. Không có bài tập.</div>';return;}
      syncWorkoutCompletion(w);
      if(isMobileUI()){
        el.innerHTML=w.exercises.map((ex,ei)=>{
          const done=ex.sets.filter(s=>isWorkoutSetComplete(s)).length,open=ei===mobileWorkoutOpen;
          return `<div class="mobile-ex-card ${open?'open':''} ${done===ex.sets.length&&ex.sets.length?'complete':''}" data-mobile-ex-card="${ei}">
            <button class="mobile-ex-summary" data-ex-toggle="${ei}"><div><span class="mobile-ex-index">${done===ex.sets.length&&ex.sets.length?'✓':ei+1}</span><div><b>${escapeHtml(ex.name)}</b><small>${escapeHtml(ex.detail||ex.group)} • ${escapeHtml(ex.targetReps)} reps • RIR ${escapeHtml(ex.targetRir)}</small></div></div><strong id="exerciseCount-${ei}">${done}/${ex.sets.length}</strong></button>
            <div class="mobile-ex-body">
              <div class="mobile-ex-meta"><span class="badge">${escapeHtml(ex.group)}</span>${ex.indirect?`<span>Secondary: ${escapeHtml(ex.indirect)}</span>`:''}</div>
              <div class="mobile-set-labels"><span>SET</span><span>KG</span><span>REP</span><span>RIR</span><span></span></div>
              ${ex.sets.map((set,si)=>`<div class="mobile-set-wrap"><div class="mobile-set-row ${isWorkoutSetComplete(set)?'set-row-complete':''}" data-set-row="${ei}-${si}"><b>${si+1}</b><input aria-label="Kg set ${si+1}" type="number" step="0.5" min="0" inputmode="decimal" data-e="${ei}" data-s="${si}" data-k="weight" value="${escapeHtml(set.weight)}" placeholder="kg"><input aria-label="Rep set ${si+1}" type="number" min="0" inputmode="numeric" data-e="${ei}" data-s="${si}" data-k="reps" value="${escapeHtml(set.reps)}" placeholder="rep"><input aria-label="RIR set ${si+1}" type="number" step="0.5" min="0" max="10" inputmode="decimal" data-e="${ei}" data-s="${si}" data-k="rir" value="${escapeHtml(set.rir)}" placeholder="RIR"><span class="mobile-set-status" data-set-status="${ei}-${si}">${isWorkoutSetComplete(set)?'✓':'○'}</span></div><details class="mobile-set-note" ${set.note?'open':''}><summary>＋ Note set ${si+1}</summary><input data-e="${ei}" data-s="${si}" data-k="note" value="${escapeHtml(set.note||'')}" placeholder="Ghi chú tùy chọn..."></details></div>`).join('')}
              <div class="progressbar"><span id="exerciseProgress-${ei}" style="width:${ex.sets.length?done/ex.sets.length*100:0}%"></span></div>
            </div>
          </div>`;
        }).join('');
        el.querySelectorAll('[data-ex-toggle]').forEach(b=>b.onclick=()=>{mobileWorkoutOpen=Number(b.dataset.exToggle);renderExerciseCards(w);updateWorkoutCompletionUI(w);});
        bindWorkoutInputs(el);
        return;
      }
      el.innerHTML=w.exercises.map((ex,ei)=>{
        const done=ex.sets.filter(s=>isWorkoutSetComplete(s)).length;
        return `<div class="exercise-card">
          <div class="exercise-top"><div><div class="exercise-name">${ei+1}. ${escapeHtml(ex.name)}</div><div class="exercise-meta">${escapeHtml(ex.detail)} • ${ex.sets.length} sets × ${escapeHtml(ex.targetReps)} reps • RIR ${escapeHtml(ex.targetRir)}${ex.indirect?` • Gián tiếp: ${escapeHtml(ex.indirect)}`:''}</div></div><span class="badge">${escapeHtml(ex.group)}</span></div>
          <div class="table-wrap" style="border:0"><table class="set-table">
            <thead><tr><th>Set</th><th>Tạ (kg)</th><th>Rep</th><th>RIR</th><th>Note <span style="font-weight:500">(tùy chọn)</span></th></tr></thead>
            <tbody>${ex.sets.map((set,si)=>`<tr data-set-row="${ei}-${si}" class="${isWorkoutSetComplete(set)?'set-row-complete':''}"><td class="set-index">${si+1}<span class="set-status-dot"></span></td><td><input type="number" step="0.5" min="0" data-e="${ei}" data-s="${si}" data-k="weight" value="${escapeHtml(set.weight)}" placeholder="kg"></td><td><input type="number" min="0" data-e="${ei}" data-s="${si}" data-k="reps" value="${escapeHtml(set.reps)}" placeholder="rep"></td><td><input type="number" step="0.5" min="0" max="10" data-e="${ei}" data-s="${si}" data-k="rir" value="${escapeHtml(set.rir)}" placeholder="RIR"></td><td><input data-e="${ei}" data-s="${si}" data-k="note" value="${escapeHtml(set.note||'')}" placeholder="Ví dụ: tempo tốt, đau vai nhẹ..."></td></tr>`).join('')}</tbody>
          </table></div><div class="progressbar"><span id="exerciseProgress-${ei}" style="width:${ex.sets.length?done/ex.sets.length*100:0}%"></span></div>
        </div>`;
      }).join('');
      bindWorkoutInputs(el);
    }


    function saveWorkoutToHistory(){
      const w=ensureCurrentWorkout();
      if(!w.exercises.length){toast('Đây là ngày nghỉ');return;}
      const st=syncWorkoutCompletion(w),copy=deepClone(w);
      copy.savedAt=new Date().toISOString();copy.completedSets=st.done;copy.totalSets=st.total;
      state.history.unshift(copy);state.currentWorkout=null;saveState();
      toast(st.complete?'Đã lưu buổi tập hoàn thành vào nhật ký':'Đã lưu tiến độ buổi tập vào nhật ký');renderWorkout();
    }

    function ensureWorkoutTemplateModal(){
      let modal=document.getElementById('workoutTemplateModal');if(modal)return modal;
      document.body.insertAdjacentHTML('beforeend',`<div class="workout-template-modal" id="workoutTemplateModal"><div class="workout-template-box"><div class="section-head"><div><h3 id="workoutTemplateTitle">Tạo từ lịch tập mẫu</h3><div class="template-preview-meta" id="workoutTemplateMeta"></div></div><button class="icon-btn" id="workoutTemplateClose" aria-label="Đóng">✕</button></div><div class="template-modal-picker"><div class="field"><label>Chọn split</label><select id="workoutTemplateModalSelect">${Object.entries(WORKOUT_TEMPLATES).map(([k,t])=>`<option value="${k}">${escapeHtml(t.label)}</option>`).join('')}</select></div><button class="btn" id="workoutTemplateRefresh">Xem lịch</button></div><div class="template-preview-grid" id="workoutTemplatePreview"></div><div class="template-modal-actions"><button class="btn" id="workoutTemplateCancel">Hủy</button><button class="btn template-add" id="workoutTemplateAdd">＋ Thêm vào lịch hiện tại</button><button class="btn primary" id="workoutTemplateReplace">Thay lịch hiện tại</button></div></div></div>`);
      modal=document.getElementById('workoutTemplateModal');const close=()=>modal.classList.remove('open');
      document.getElementById('workoutTemplateClose').onclick=close;document.getElementById('workoutTemplateCancel').onclick=close;modal.addEventListener('pointerdown',e=>{if(e.target===modal)close();});
      document.getElementById('workoutTemplateModalSelect').onchange=e=>openWorkoutTemplatePreview(e.target.value);
      document.getElementById('workoutTemplateRefresh').onclick=()=>openWorkoutTemplatePreview(document.getElementById('workoutTemplateModalSelect').value);
      return modal;
    }

    function openWorkoutTemplatePreview(key='4'){
      const tpl=workoutTemplateSchedule(key);if(!tpl)return;
      const modal=ensureWorkoutTemplateModal();modal._templateKey=String(key);
      const select=document.getElementById('workoutTemplateModalSelect');if(select&&select.value!==String(key))select.value=String(key);
      document.getElementById('workoutTemplateTitle').textContent='Tạo từ lịch tập mẫu';
      document.getElementById('workoutTemplateMeta').textContent=`${tpl.label} • ${tpl.split} • ${tpl.summary} Xem trước toàn bộ bài rồi chọn thêm vào lịch hoặc thay lịch hiện tại.`;
      document.getElementById('workoutTemplatePreview').innerHTML=tpl.sessions.map(sess=>`<div class="template-day-card"><div class="day">${escapeHtml(sess.day)}</div><h4>${escapeHtml(sess.name)}</h4><p>${escapeHtml(sess.focus)}</p><ol>${sess.exercises.map(ex=>`<li>${escapeHtml(ex.name)} <span>• ${ex.sets} × ${escapeHtml(ex.reps)} • RIR ${escapeHtml(ex.rir)}</span></li>`).join('')}</ol></div>`).join('');
      document.getElementById('workoutTemplateAdd').onclick=()=>applyWorkoutTemplate(modal._templateKey,'add');document.getElementById('workoutTemplateReplace').onclick=()=>applyWorkoutTemplate(modal._templateKey,'replace');modal.classList.add('open');
    }

    function applyWorkoutTemplate(key,mode='replace'){
      const tpl=workoutTemplateSchedule(key); if(!tpl)return;
      const allDays=Object.keys(defaultSchedule);
      if(mode==='replace'){
        const fresh={}; allDays.forEach(day=>fresh[day]={name:'REST',focus:'Rest & Recovery',exercises:[]});
        tpl.sessions.forEach(sess=>{fresh[sess.day]={name:sess.name,focus:sess.focus,exercises:deepClone(sess.exercises)};});
        state.schedule=fresh;
      }else{
        tpl.sessions.forEach(sess=>{
          if(!state.schedule[sess.day])state.schedule[sess.day]={name:'REST',focus:'Rest & Recovery',exercises:[]};
          const dest=state.schedule[sess.day];
          if(!dest.exercises?.length||dest.name==='REST'){
            dest.name=sess.name;dest.focus=sess.focus;dest.exercises=deepClone(sess.exercises);
          }else{
            dest.exercises.push(...deepClone(sess.exercises));
          }
        });
      }
      state.currentWorkout=null;
      const first=tpl.sessions[0]?.day||'Thứ 2'; state.scheduleEditorDay=first; state.currentDay=first;
      saveState();
      document.getElementById('workoutTemplateModal')?.classList.remove('open');
      renderSchedule();
      toast(mode==='replace'?`Đã áp dụng ${tpl.label}`:`Đã thêm ${tpl.label} vào lịch hiện tại`);
    }

    function renderSchedule(){
      if(isMobileUI()) return renderScheduleMobile();
      return renderScheduleDesktop();
    }

    function renderScheduleDesktop(){
      const page=document.getElementById('page-schedule'),day=state.scheduleEditorDay||'Thứ 2';state.scheduleEditorDay=day;
      const days=Object.keys(state.schedule),s=state.schedule[day];
      page.innerHTML=`
        <div class="card pad">
          <div class="section-head"><div><h3>Lịch tập</h3><p>Quản lý program hiện tại. Tạo lịch mẫu khi cần, sau đó chỉnh trực tiếp từng ngày.</p></div><div class="schedule-head-actions"><button class="btn" id="workoutTemplatePreviewBtn">⚡ Tạo từ lịch mẫu</button><button class="btn danger" id="clearDayExercises">Xóa tất cả bài</button></div></div>
          <div class="toolbar">
            <div class="field"><label>Chọn ngày</label><select id="scheduleDay">${days.map(d=>`<option ${d===day?'selected':''}>${d}</option>`).join('')}</select></div>
            <div class="field grow"><label>Tên buổi</label><input id="sessionName" value="${escapeHtml(s.name)}"></div>
            <div class="field grow"><label>Focus</label><input id="sessionFocus" value="${escapeHtml(s.focus)}"></div>
            <button class="btn primary" id="addExercise">+ Thêm bài tập</button>
          </div>
          <div class="table-wrap mobile-cards"><table class="data schedule-table"><thead><tr><th>#</th><th>Bài tập</th><th>Vùng tác động</th><th>Nhóm trực tiếp</th><th>Nhóm gián tiếp</th><th>Sets</th><th>Reps</th><th>RIR</th><th></th></tr></thead><tbody id="scheduleRows"></tbody></table></div>
          <div class="note" style="margin-top:14px"><b>Volume trực tiếp:</b> 1 set = 1 set cho “Nhóm trực tiếp”. <b>Volume gián tiếp:</b> mỗi nhóm ghi ở cột “Nhóm gián tiếp” được tính theo hệ số ở trang Volume.</div>
        </div>`;
      document.getElementById('workoutTemplatePreviewBtn').onclick=()=>openWorkoutTemplatePreview('4');
      document.getElementById('clearDayExercises').onclick=()=>{const count=s.exercises.length;if(!count){toast(`${day} chưa có bài tập`);return;}confirmBox('Xóa tất cả bài',`Xóa toàn bộ ${count} bài của ${day}?`,()=>{s.exercises=[];s.name='REST';s.focus='Rest & Recovery';invalidateWorkoutFor(day);saveState();renderSchedule();toast(`Đã xóa toàn bộ bài của ${day}`);});};
      document.getElementById('scheduleDay').onchange=e=>{state.scheduleEditorDay=e.target.value;renderSchedule();};
      document.getElementById('sessionName').oninput=e=>{s.name=e.target.value;invalidateWorkoutFor(day);saveState();};
      document.getElementById('sessionFocus').oninput=e=>{s.focus=e.target.value;invalidateWorkoutFor(day);saveState();};
      document.getElementById('addExercise').onclick=()=>{s.exercises.push({name:'Bài tập mới',detail:'',group:'Khác',indirect:'',sets:3,reps:'8–12',rir:'1–2'});if(s.name==='REST')s.name='CUSTOM';invalidateWorkoutFor(day);saveState();renderSchedule();};
      renderScheduleRows(day);
    }

    function renderScheduleMobile(){
      const page=document.getElementById('page-schedule'),day=state.scheduleEditorDay||'Thứ 2';state.scheduleEditorDay=day;
      const days=Object.keys(state.schedule),sess=state.schedule[day],short={'Thứ 2':'T2','Thứ 3':'T3','Thứ 4':'T4','Thứ 5':'T5','Thứ 6':'T6','Thứ 7':'T7','Chủ nhật':'CN'};

    function ensureScheduleExerciseSheet(){
      let m=document.getElementById('scheduleExerciseSheet');if(m)return m;

    function openScheduleExerciseSheet(day,index){

      body.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{const i=+b.dataset.down;if(i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];invalidateWorkoutFor(day);saveState();renderSchedule();}});
    }

    function addVolume(out,group,key,value){
      const g=(group||'Khác').trim()||'Khác';
      if(!out[g]) out[g]={direct:0,indirect:0};
      out[g][key]+=Number(value)||0;
    }
    function plannedVolume(){
      const out={};
      const factor=Number(state.settings?.indirectFactor ?? 0.5);
      Object.values(state.schedule).forEach(day=>day.exercises.forEach(ex=>{
        const sets=Number(ex.sets)||0;
        const direct=(ex.group||'Khác').trim()||'Khác';
        addVolume(out,direct,'direct',sets);
        splitIndirectGroups(ex.indirect).forEach(g=>{ if(g!==direct) addVolume(out,g,'indirect',sets*factor); });
      }));
      return out;
    }
    function startOfWeek(date=new Date()){
      const d=new Date(date); const day=d.getDay(); const diff=(day===0?-6:1-day); d.setDate(d.getDate()+diff); d.setHours(0,0,0,0); return d;
    }
    function completedVolumeThisWeek(){
      const out={}; const start=startOfWeek(); const end=new Date(start); end.setDate(end.getDate()+7);
      const factor=Number(state.settings?.indirectFactor ?? 0.5);
      state.history.forEach(h=>{
        const d=new Date(h.date+'T12:00:00'); if(d<start||d>=end) return;
        h.exercises.forEach(ex=>{
          const direct=(ex.group||'Khác').trim()||'Khác';
          const n=ex.sets.filter(s=>s.done).length;
          addVolume(out,direct,'direct',n);
          splitIndirectGroups(ex.indirect || defaultIndirectFor(ex)).forEach(g=>{ if(g!==direct) addVolume(out,g,'indirect',n*factor); });
        });
      }); return out;
    }
    function fmtVolume(n){
      const x=Math.round((Number(n)||0)*10)/10;
      return Number.isInteger(x)?String(x):x.toFixed(1);
    }
    function renderVolume(){
      const page=document.getElementById('page-volume');
      const planned=plannedVolume(),done=completedVolumeThisWeek(),extra=[...new Set([...Object.keys(planned),...Object.keys(done)])].filter(g=>!MUSCLE_GROUPS.includes(g)).sort(),groups=[...MUSCLE_GROUPS,...extra],factor=Number(state.settings?.indirectFactor??0.5);
      const totalDirect=groups.reduce((a,g)=>a+(planned[g]?.direct||0),0),totalIndirect=groups.reduce((a,g)=>a+(planned[g]?.indirect||0),0),totalEffective=totalDirect+totalIndirect;
      if(isMobileUI()){
        const active=groups.filter(g=>(planned[g]?.direct||0)+(planned[g]?.indirect||0)+(done[g]?.direct||0)+(done[g]?.indirect||0)>0);
        page.innerHTML=`<div class="mobile-page-head"><div><div class="eyebrow">WEEKLY LOAD</div><h2>Volume</h2><p>Direct + indirect theo nhóm cơ.</p></div></div>
          <div class="mobile-kpi-row volume"><div class="mobile-kpi"><b>${fmtVolume(totalDirect)}</b><span>Direct</span></div><div class="mobile-kpi"><b>${fmtVolume(totalIndirect)}</b><span>Indirect</span></div><div class="mobile-kpi"><b>${fmtVolume(totalEffective)}</b><span>Total</span></div></div>
          <details class="volume-rule-details mobile-volume-rule"><summary><span>Hệ số gián tiếp</span><span>${factor}</span></summary><div class="volume-rule-body"><div class="field"><label>1 set gián tiếp =</label><input id="indirectFactor" type="number" min="0" max="1" step="0.1" value="${factor}"></div></div></details>
          <div class="mobile-volume-cards">${active.length?active.map(g=>{const pd=planned[g]?.direct||0,pi=planned[g]?.indirect||0,pt=pd+pi,dd=done[g]?.direct||0,di=done[g]?.indirect||0,dt=dd+di,pct=pt?Math.min(100,dt/pt*100):0;return `<div class="card mobile-volume-card"><div class="mobile-volume-card-head"><b>${escapeHtml(g)}</b><strong>${fmtVolume(dt)} / ${fmtVolume(pt)}</strong></div><div class="progressbar"><span style="width:${pct}%"></span></div><div class="mobile-volume-split"><span>Direct <b>${fmtVolume(dd)}/${fmtVolume(pd)}</b></span><span>Indirect <b>${fmtVolume(di)}/${fmtVolume(pi)}</b></span><span>${pct.toFixed(0)}%</span></div></div>`;}).join(''):'<div class="empty">Chưa có volume để hiển thị.</div>'}</div>`;
      }else{
        page.innerHTML=`
          <div class="card hero-main" style="margin-bottom:14px"><div class="eyebrow">Weekly volume</div><h2>Volume đầy đủ theo nhóm cơ</h2><p class="subtitle">Tách volume trực tiếp và gián tiếp; dữ liệu đã tập lấy từ các set đã nhập đủ Tạ + Rep + RIR và lưu vào nhật ký.</p><div class="stats"><div class="stat"><b>${fmtVolume(totalDirect)}</b><span>Sets trực tiếp / tuần</span></div><div class="stat"><b>${fmtVolume(totalIndirect)}</b><span>Sets gián tiếp quy đổi</span></div><div class="stat"><b>${fmtVolume(totalEffective)}</b><span>Tổng volume hiệu dụng</span></div></div></div>
          <details class="volume-rule-details" style="margin-bottom:14px"><summary><span>Quy tắc volume gián tiếp</span><span>Hệ số hiện tại: ${factor}</span></summary><div class="volume-rule-body"><div class="field" style="max-width:260px"><label>Hệ số cho 1 set gián tiếp</label><input id="indirectFactor" type="number" min="0" max="1" step="0.1" value="${factor}"></div><div class="small" style="margin-top:9px">Ví dụ hệ số 0.5: 3 sets Bench Press với “Tay sau, Vai trước” = 1.5 set gián tiếp cho mỗi nhóm.</div><div class="note" style="margin-top:10px">Đây là quy ước theo dõi volume. Có thể sửa “Nhóm gián tiếp” cho từng bài ở Lịch tập.</div></div></details>
          <div class="card pad"><div class="section-head"><div><h3>Bảng volume tuần</h3><p>Trực tiếp + gián tiếp = tổng volume hiệu dụng theo quy ước của bạn.</p></div></div><div class="table-wrap"><table class="data" style="min-width:980px"><thead><tr><th>Nhóm cơ</th><th>Trực tiếp<br>Kế hoạch</th><th>Gián tiếp<br>Kế hoạch</th><th>Tổng<br>Kế hoạch</th><th>Trực tiếp<br>Đã tập</th><th>Gián tiếp<br>Đã tập</th><th>Tổng<br>Đã tập</th><th>Hoàn thành</th></tr></thead><tbody>${groups.map(g=>{const pd=planned[g]?.direct||0,pi=planned[g]?.indirect||0,pt=pd+pi,dd=done[g]?.direct||0,di=done[g]?.indirect||0,dt=dd+di,pct=pt?Math.min(100,dt/pt*100):0;return `<tr><td><b>${escapeHtml(g)}</b></td><td>${fmtVolume(pd)}</td><td>${fmtVolume(pi)}</td><td><b>${fmtVolume(pt)}</b></td><td>${fmtVolume(dd)}</td><td>${fmtVolume(di)}</td><td><b>${fmtVolume(dt)}</b></td><td>${pt?`${pct.toFixed(0)}%`:'-'}</td></tr>`;}).join('')}</tbody></table></div></div>`;
      }
      const factorInput=document.getElementById('indirectFactor');if(factorInput)factorInput.onchange=e=>{const v=Math.max(0,Math.min(1,Number(e.target.value)||0));state.settings.indirectFactor=v;saveState();renderVolume();toast(`Hệ số gián tiếp: ${v}`);};
    }

      const page=document.getElementById('page-more');

        <div class="more-menu"><button class="card more-item" data-more-page="volume"><span>▥</span><div><b>Volume</b><small>Direct + indirect theo tuần</small></div><i>›</i></button><button class="card more-item" data-more-page="history"><span>◴</span><div><b>Nhật ký</b><small>Lịch sử các buổi đã lưu</small></div><i>›</i></button><button class="card more-item" data-more-page="data"><span>☁</span><div><b>Cloud & Dữ liệu</b><small>Sync • Backup • Export • Account</small></div><i>›</i></button><button class="card more-item" id="moreInstall"><span>⬇</span><div><b>Cài ứng dụng</b><small>Thêm MASTER lên màn hình chính</small></div><i>›</i></button></div>`;

      return `<table class="mini-table"><thead><tr><th>Bài</th><th>Set</th><th>Kg</th><th>Reps</th><th>RIR</th><th>Note</th><th>Done</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
    }

        <div class="grid2" style="margin-top:18px">
          <div class="card pad"><div class="section-head"><div><h3>Backup / Restore</h3><p>Nên giữ backup JSON định kỳ dù đã có cloud sync.</p></div></div><div class="data-actions"><button class="btn primary" id="exportJson">Tải backup JSON</button><label class="btn" for="importJson">Nhập backup JSON</label><input id="importJson" type="file" accept="application/json" style="display:none"></div></div>
          <div class="card pad"><div class="section-head"><div><h3>Xuất dữ liệu</h3><p>CSV mở được bằng Excel / Google Sheets.</p></div></div><div class="data-actions"><button class="btn" id="exportScheduleCsv">Xuất lịch tập CSV</button><button class="btn" id="exportHistoryCsv">Xuất nhật ký CSV</button></div></div>
        </div>
        <div class="card pad" style="margin-top:18px"><div class="section-head"><div><h3>Reset ứng dụng</h3><p>Khôi phục chương trình mặc định và xóa toàn bộ nhật ký trên thiết bị này. Cloud không tự xóa.</p></div></div><button class="btn danger" id="resetAll">Reset toàn bộ dữ liệu local</button></div>`;

      document.getElementById('saveCloudConfig').onclick=()=>{
        cloud.projectUrl=cleanCloudUrl(document.getElementById('cloudUrl').value);
        cloud.publishableKey=document.getElementById('cloudKey').value.trim();
        cloud.email=document.getElementById('cloudEmail').value.trim();
        cloud.session=null; cloud.ready=false; cloud.conflict=false; cloud.lastRemoteUpdatedAt=null; cloud.lastError=''; saveCloudConfig(); updateCloudStatus(); renderData(); toast('Đã lưu cấu hình Supabase');
      };
      document.getElementById('cloudAutoSync').onchange=e=>{cloud.autoSync=e.target.checked;saveCloudConfig(); if(cloud.autoSync)scheduleCloudSync();};
      document.getElementById('cloudSignup').onclick=cloudSignup;
      document.getElementById('cloudResend').onclick=cloudResendConfirmation;
      document.getElementById('cloudLogin').onclick=cloudLogin;
      const logout=document.getElementById('cloudLogout'); if(logout)logout.onclick=cloudLogout;
      document.getElementById('cloudSyncNow').onclick=async()=>{
        if(cloud.dirty){const ok=await cloudPush(false); if(ok)toast('Đã đẩy thay đổi lên cloud');}
        else {const ok=await cloudPull(false); if(ok)toast('Cloud đã đồng bộ');}
        renderData();
      };
      document.getElementById('cloudPush').onclick=()=>confirmBox('Đẩy dữ liệu máy này lên cloud','Thao tác này sẽ lấy dữ liệu trên thiết bị hiện tại làm bản chính.',async()=>{const ok=await cloudPush(true); if(ok)toast('Đã đẩy dữ liệu lên cloud');renderData();});
      document.getElementById('cloudPull').onclick=()=>confirmBox('Tải dữ liệu cloud về máy','Dữ liệu local hiện tại sẽ được thay bằng bản cloud.',async()=>{const ok=await cloudPull(true); if(ok)toast('Đã tải dữ liệu cloud về');renderData();});
      document.getElementById('exportJson').onclick=exportBackup;
      document.getElementById('importJson').onchange=importBackup;
      document.getElementById('exportScheduleCsv').onclick=exportScheduleCsv;
      document.getElementById('exportHistoryCsv').onclick=exportHistoryCsv;
      document.getElementById('resetAll').onclick=()=>confirmBox('Reset toàn bộ','Lịch tập và nhật ký local sẽ trở về mặc định. Dữ liệu cloud không tự xóa.',()=>{state=defaultState();saveState();showPage('dashboard');toast('Đã reset dữ liệu local');});
    }

    async function cloudSignup(){
      cloud.projectUrl=cleanCloudUrl(document.getElementById('cloudUrl')?.value||cloud.projectUrl);
      cloud.publishableKey=(document.getElementById('cloudKey')?.value||cloud.publishableKey).trim();
      cloud.email=(document.getElementById('cloudEmail')?.value||cloud.email).trim();
      const password=document.getElementById('cloudPassword')?.value||''; saveCloudConfig();
      if(!cloudConfigured()||!cloud.email||password.length<6){alert('Nhập Project URL, Publishable key, email và mật khẩu tối thiểu 6 ký tự.');return;}
      cloudBusy=true;updateCloudStatus();
      try{
        const r=await fetch(`${cloud.projectUrl}/auth/v1/signup?redirect_to=${encodeURIComponent(CLOUD_EMAIL_REDIRECT)}`,{method:'POST',headers:{'apikey':cloud.publishableKey,'Content-Type':'application/json'},body:JSON.stringify({email:cloud.email,password})});
        const data=await r.json().catch(()=>({})); if(!r.ok)throw new Error(data.msg||data.error_description||data.message||'Không tạo được tài khoản.');
        if(data.access_token){setCloudSession(data);toast('Tạo tài khoản và đăng nhập thành công');}
        else toast('Đã tạo tài khoản. Kiểm tra email xác nhận rồi đăng nhập.');
      }catch(e){alert(e.message||String(e));}
      finally{cloudBusy=false;updateCloudStatus();renderData();}
    }
    async function cloudResendConfirmation(){
      cloud.projectUrl=cleanCloudUrl(document.getElementById('cloudUrl')?.value||cloud.projectUrl);
      cloud.publishableKey=(document.getElementById('cloudKey')?.value||cloud.publishableKey).trim();
      cloud.email=(document.getElementById('cloudEmail')?.value||cloud.email).trim();
      saveCloudConfig();
      if(!cloudConfigured()||!cloud.email){alert('Nhập Project URL, Publishable key và email trước.');return;}
      cloudBusy=true; cloud.lastError=''; updateCloudStatus();
      try{
        const r=await fetch(`${cloud.projectUrl}/auth/v1/resend?redirect_to=${encodeURIComponent(CLOUD_EMAIL_REDIRECT)}`,{
          method:'POST',
          headers:{'apikey':cloud.publishableKey,'Content-Type':'application/json'},
          body:JSON.stringify({type:'signup',email:cloud.email})
        });
        const data=await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(data.msg||data.error_description||data.message||'Không gửi lại được email xác nhận.');
        toast('Đã gửi lại email xác nhận. Hãy mở email mới nhất.');
        alert(`Đã gửi lại email xác nhận tới ${cloud.email}.\n\nHãy mở EMAIL MỚI NHẤT và bấm link xác nhận. Sau xác nhận, bạn sẽ được đưa về TRUE TRAIN • MASTER TRAINING TRACKER.`);
      }catch(e){cloud.lastError=e.message||String(e);saveCloudConfig();alert(cloud.lastError);}
      finally{cloudBusy=false;updateCloudStatus();renderData();}
    }

    async function cloudLogin(){
      cloud.projectUrl=cleanCloudUrl(document.getElementById('cloudUrl')?.value||cloud.projectUrl);
      cloud.publishableKey=(document.getElementById('cloudKey')?.value||cloud.publishableKey).trim();
      cloud.email=(document.getElementById('cloudEmail')?.value||cloud.email).trim();
      const password=document.getElementById('cloudPassword')?.value||''; saveCloudConfig();
      if(!cloudConfigured()||!cloud.email||!password){alert('Nhập Project URL, Publishable key, email và mật khẩu.');return;}
      cloudBusy=true;cloud.lastError='';updateCloudStatus();
      try{
        const r=await fetch(`${cloud.projectUrl}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':cloud.publishableKey,'Content-Type':'application/json'},body:JSON.stringify({email:cloud.email,password})});
        const data=await r.json().catch(()=>({})); if(!r.ok)throw new Error(data.msg||data.error_description||data.message||'Đăng nhập thất bại.');
        setCloudSession(data); cloud.conflict=false; cloud.lastError=''; saveCloudConfig(); toast('Đăng nhập cloud thành công');
        // Không tự đẩy dữ liệu lần đầu để tránh ghi đè nhầm giữa PC và điện thoại.
      }catch(e){cloud.lastError=e.message||String(e);saveCloudConfig();alert(cloud.lastError);}
      finally{cloudBusy=false;updateCloudStatus();renderData();}
    }
   function cloudLogout(){

  authRecoveryMode = false;
  cloud.session = null;
  cloud.ready = false;
  cloud.conflict = false;
  cloud.lastRemoteUpdatedAt = null;

  saveCloudConfig();

  activePage = 'dashboard';

  const pass =
    document.getElementById('authPassword');

  if(pass){
    pass.value = '';
  }

  updateCloudStatus();

  applyAuthGate();
}

    function download(name,content,type='text/plain;charset=utf-8'){
      const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob); const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
    }
    function exportBackup(){download(`gym_tracker_backup_${isoDate()}.json`,JSON.stringify(state,null,2),'application/json');}
    function importBackup(e){
      const file=e.target.files[0]; if(!file)return; const r=new FileReader(); r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.schedule||!x.history)throw Error();state=x;saveState();toast('Đã khôi phục backup');showPage('dashboard');}catch{alert('File backup không hợp lệ.');}}; r.readAsText(file);
    }
    function csvCell(v){const s=String(v??'');return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;}
    function exportScheduleCsv(){
      const rows=[['Ngày','Buổi','Focus','Bài tập','Vùng tác động','Nhóm trực tiếp','Nhóm gián tiếp','Sets','Reps','RIR']];
      Object.entries(state.schedule).forEach(([day,s])=>s.exercises.forEach(ex=>rows.push([day,s.name,s.focus,ex.name,ex.detail,ex.group,ex.indirect||'',ex.sets,ex.reps,ex.rir])));
      download(`lich_tap_${isoDate()}.csv`,'\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8');
    }
    function exportHistoryCsv(){
      const rows=[['Ngày','Thứ','Buổi','Bài tập','Nhóm trực tiếp','Nhóm gián tiếp','Set','Kg','Reps','RIR','Note','Hoàn thành']];
      state.history.forEach(h=>h.exercises.forEach(ex=>ex.sets.forEach(s=>rows.push([h.date,h.day,h.title,ex.name,ex.group,ex.indirect||defaultIndirectFor(ex),s.index,s.weight,s.reps,s.rir,s.note||'',(s.done??isWorkoutSetComplete(s))?'Có':'Không']))));
      download(`nhat_ky_tap_${isoDate()}.csv`,'\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8');
    }

    function confirmBox(title,text,onOk){
      const m=document.getElementById('confirmModal'); document.getElementById('confirmTitle').textContent=title;document.getElementById('confirmText').textContent=text;m.classList.add('open');
      const close=()=>m.classList.remove('open'); document.getElementById('confirmCancel').onclick=close; document.getElementById('confirmOk').onclick=()=>{close();onOk();};
    }

    // PWA install + offline support (GitHub Pages / HTTPS)
    let deferredInstallPrompt=null;
    function syncInstallButtons(){
      document.querySelectorAll('.pwa-install').forEach(b=>b.classList.toggle('show',!!deferredInstallPrompt));
    }
    async function installPwa(){
      if(!deferredInstallPrompt){
        toast('iPhone: Safari → Chia sẻ → Thêm vào Màn hình chính');
        return;
      }
      deferredInstallPrompt.prompt();
      try{ await deferredInstallPrompt.userChoice; }catch(e){}
      deferredInstallPrompt=null; syncInstallButtons();
    }
    window.addEventListener('beforeinstallprompt',e=>{
      e.preventDefault(); deferredInstallPrompt=e; syncInstallButtons();
    });
    window.addEventListener('appinstalled',()=>{ deferredInstallPrompt=null; syncInstallButtons(); toast('Đã cài TRUE TRAIN • MASTER TRAINING TRACKER'); });
    if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
      window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    }

    document.getElementById('confirmModal').addEventListener('click',e=>{if(e.target.id==='confirmModal')e.currentTarget.classList.remove('open');});
    document.getElementById('backupBtn').onclick=exportBackup;
    document.getElementById('cloudStatusBtn').onclick=()=>showPage('data');
    window.addEventListener('online',()=>{updateCloudStatus();cloudSyncNow();});
    window.addEventListener('offline',updateCloudStatus);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){updateCloudStatus();cloudSyncNow();}});
    setInterval(()=>cloudSyncNow(),15000);
    const installBtn=document.getElementById('installBtn'); if(installBtn) installBtn.onclick=installPwa;
    const mobileDataBtn=document.getElementById('mobileDataBtn'); if(mobileDataBtn) mobileDataBtn.onclick=()=>showPage(isMobileUI()?'more':'data');
    const authLoginBtn = document.getElementById('authLoginBtn');
    const authRegisterBtn = document.getElementById('authRegisterBtn');
    const authForgotBtn = document.getElementById('authForgotBtn');
    const authResetBtn = document.getElementById('authResetBtn');
    const authResetCancelBtn = document.getElementById('authResetCancelBtn');
    const authPassword = document.getElementById('authPassword');
    const authNewPasswordConfirm = document.getElementById('authNewPasswordConfirm');

    if(authLoginBtn) authLoginBtn.addEventListener('click', authGateLogin);
    if(authRegisterBtn) authRegisterBtn.addEventListener('click', authGateSignup);
    if(authForgotBtn) authForgotBtn.addEventListener('click', authGateForgotPassword);
    if(authResetBtn) authResetBtn.addEventListener('click', authGateResetPassword);
    if(authResetCancelBtn) authResetCancelBtn.addEventListener('click', ()=>{
      authRecoveryMode = false;
      cloud.session = null;
      saveCloudConfig();
      setAuthMessage('');
      applyAuthGate();
    });
    if(authPassword) authPassword.addEventListener('keydown', e=>{ if(e.key==='Enter') authGateLogin(); });
    if(authNewPasswordConfirm) authNewPasswordConfirm.addEventListener('keydown', e=>{ if(e.key==='Enter') authGateResetPassword(); });

syncInstallButtons();
updateCloudStatus();
applyAuthGate();

if(authRedirectHandled && cloudLoggedIn()){
  setTimeout(()=>{
    if(authRecoveryMode){
      setAuthMessage('Liên kết khôi phục hợp lệ. Hãy đặt mật khẩu mới.', 'success');
    }else{
      toast('Email đã xác nhận • Đã đăng nhập cloud');
    }
  },350);
}

if(cloudLoggedIn()){
  setTimeout(
    ()=>cloudSyncNow(),
    800
  );
}
  })();
  </script>
